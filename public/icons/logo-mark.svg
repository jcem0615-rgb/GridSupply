<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="GridSupply">
  <title>GridSupply</title>
  <defs>
    <linearGradient id="gsDeep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2C6FB0"/><stop offset="1" stop-color="#123F6E"/>
    </linearGradient>
    <linearGradient id="gsCyan" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2A9FD8"/><stop offset="1" stop-color="#63C8F0"/>
    </linearGradient>
    <clipPath id="gsGlobe"><circle cx="248" cy="242" r="128"/></clipPath>
  </defs>

  <!-- Globe: curved meridians over straight latitudes so it reads as a sphere
       rather than as a flat lattice -->
  <g clip-path="url(#gsGlobe)">
    <circle cx="248" cy="242" r="128" fill="#E8F3FC"/>
    <g stroke="#4A8FC9" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.9">
      <path d="M116 178 H380 M110 242 H386 M116 306 H380"/>
    </g>
    <g stroke="#2C6FB0" stroke-width="10" fill="none" opacity="0.9">
      <path d="M248 110 C 196 176 196 308 248 374"/>
      <path d="M248 110 C 300 176 300 308 248 374"/>
      <path d="M248 110 V 374"/>
      <path d="M248 110 C 150 176 150 308 248 374"/>
      <path d="M248 110 C 346 176 346 308 248 374"/>
    </g>
  </g>

  <!-- Orbit arcs: deep sweep, gold crown, cyan tail -->
  <circle cx="248" cy="242" r="148" fill="none" stroke="url(#gsDeep)" stroke-width="26"
          stroke-linecap="round" stroke-dasharray="600 1000" transform="rotate(126 248 242)"/>
  <circle cx="248" cy="242" r="174" fill="none" stroke="#F0B32A" stroke-width="21"
          stroke-linecap="round" stroke-dasharray="290 1600" transform="rotate(-108 248 242)"/>
  <circle cx="248" cy="242" r="174" fill="none" stroke="url(#gsCyan)" stroke-width="21"
          stroke-linecap="round" stroke-dasharray="250 1600" transform="rotate(34 248 242)"/>

  <!-- Growth arrow, clear of the pencil so both stay legible -->
  <path d="M300 336 L344 286 L374 312 L418 250" fill="none" stroke="url(#gsCyan)"
        stroke-width="23" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M386 240 L432 232 L426 278 Z" fill="#2A9FD8"/>

  <!-- Pencil -->
  <g transform="rotate(40 300 236)">
    <rect x="280" y="92" width="44" height="196" rx="6" fill="#F0B32A"/>
    <rect x="280" y="92" width="15" height="196" fill="#F8D169"/>
    <rect x="280" y="188" width="44" height="25" fill="#2A9FD8"/>
    <path d="M280 92 L324 92 L302 44 Z" fill="#F5DCA8"/>
    <path d="M291 66 L313 66 L302 44 Z" fill="#143C63"/>
    <rect x="280" y="288" width="44" height="13" rx="4" fill="#D9971A"/>
  </g>

  <!-- Open ledger: two pages meeting at a spine -->
  <g stroke="#143C63" stroke-width="15" stroke-linejoin="round" fill="#FFFFFF">
    <path d="M248 366 C 212 340 160 334 112 346 L112 398 C 160 388 212 394 248 420 Z"/>
    <path d="M248 366 C 284 340 336 334 384 346 L384 398 C 336 388 284 394 248 420 Z"/>
  </g>
  <path d="M248 366 V 420" stroke="#143C63" stroke-width="14" stroke-linecap="round"/>
</svg>
